; PlatformIO project for the DISPLAY board (Sunton CYD, ESP32-S3, 16MB, OPI PSRAM).
;
; Mirrors the arduino-cli Makefile (FQBN esp32:esp32:esp32s3,
; PSRAM=opi,FlashSize=16M). `build_flags = -I..` pulls in the shared headers
; (hot_tub_types.h, secrets.h) from the repo root, retiring the symlink hack.
;
; LVGL + Arduino_GFX are vendored under ../libs, so lib_extra_dirs points there.
; LVGL needs an lv_conf.h on the include path — copy display/lv_conf.h.example to
; display/lv_conf.h (kept out of git) and it will be picked up via -I. and
; -DLV_CONF_INCLUDE_SIMPLE.
;
; Usage:
;   cd display
;   pio run
;   pio run -t upload
;   pio device monitor
;
; NOTE: untested starting point — display/PSRAM/partition flags very likely need
; tuning for your exact board revision.

[platformio]
src_dir = .
include_dir = .

[env:display]
; Arduino-ESP32 3.x (IDF 5.x); see controller/platformio.ini.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
; OPI PSRAM (matches PSRAM=opi in the Makefile)
board_build.arduino.memory_type = qio_opi

build_flags =
    -I..
    -I${PROJECT_DIR}          ; so LVGL (built as a library) finds display/lv_conf.h
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
build_unflags = -std=gnu++11

; LVGL and Arduino_GFX are vendored here
lib_extra_dirs = ../libs
; touch.h selects GT911 (capacitive) — correct for the Sunton 4827S043, driven via
; bb_captouch (works with the Arduino-ESP32 3.x I2C driver; TAMC_GT911 does not).
; For a resistive panel, switch the #define in touch.h back to TOUCH_XPT2046 and
; use PaulStoffregen/XPT2046_Touchscreen here instead.
lib_deps =
    paulstoffregen/Time @ ^1.6.1
    bitbank2/bb_captouch
