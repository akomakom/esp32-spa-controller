; PlatformIO project for the DISPLAY board (Sunton CYD, ESP32-S3, 16MB, OPI PSRAM).
;
; Board config: ESP32-S3, OPI PSRAM, 16MB flash. `build_flags = -I..` pulls in
; the shared headers (hot_tub_types.h, secrets.h) from the repo root, so no
; per-directory header symlinks are needed.
;
; LVGL + Arduino_GFX come from the PlatformIO registry (lib_deps) — nothing large
; is vendored. Arduino_GFX >=1.6.7 exposes bounce_buffer_size_px as a constructor
; parameter (see gfx.h) and does its own Cache_WriteBack to PSRAM, so no local
; patch is needed for the anti-flicker bounce buffer. The only vendored library is
; XPT2046_Touchscreen (display/lib/, auto-included) which carries a one-line local
; patch (500kHz SPI for ADC settling) that isn't configurable from the registry copy.
; LVGL needs an lv_conf.h on the include path — copy display/lv_conf.h.example to
; display/lv_conf.h (kept out of git) and it will be picked up via -I. and
; -DLV_CONF_INCLUDE_SIMPLE.
;
; Usage:
;   cd display
;   pio run
;   pio run -t upload
;   pio device monitor
;
; NOTE: untested starting point — display/PSRAM/partition flags very likely need
; tuning for your exact board revision.

[platformio]
src_dir = .
include_dir = .

[env:display]
; Arduino-ESP32 3.x (IDF 5.x); see controller/platformio.ini.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
; OPI PSRAM
board_build.arduino.memory_type = qio_opi

build_flags =
    -I..
    -I${PROJECT_DIR}          ; so LVGL (built as a library) finds display/lv_conf.h
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
build_unflags = -std=gnu++11

; src_dir is the display/ root, which also contains lib/ (the vendored
; XPT2046_Touchscreen). Exclude lib/ from source compilation so it is built only
; once, via the library dependency finder, instead of being double-compiled here.
build_src_filter = +<*> -<lib/>

; XPT2046_Touchscreen (touch.h selects XPT2046 resistive) lives in display/lib/ and
; is auto-included by PlatformIO; everything else is fetched from the registry.
lib_deps =
    paulstoffregen/Time @ ^1.6.1
    lvgl/lvgl @ 8.3.11
    moononournation/GFX Library for Arduino @ ^1.6.7
