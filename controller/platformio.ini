; PlatformIO project for the SPA CONTROLLER board (ESP32-WROOM + 8ch relay).
;
; Why this exists: arduino-cli (see Makefile) works but is environment-sensitive.
; PlatformIO pins library versions and, via `build_flags = -I..`, lets the sketch
; include the shared headers (hot_tub_types.h, secrets.h) straight from the repo
; root — so the old "symlink the parent header into this dir" hack is no longer needed.
;
; Usage:
;   cd controller
;   pio run                 # compile
;   pio run -t upload       # flash firmware over USB
;   pio run -t uploadfs     # flash the data/ web UI to SPIFFS
;   pio device monitor      # serial console
;
; NOTE: untested starting point — verify the board id / libs against your setup.

[platformio]
src_dir = .
include_dir = .

[env:controller]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Resolve shared headers from the repo root instead of per-dir symlinks.
build_flags =
    -I..
    -std=gnu++17
build_unflags = -std=gnu++11

board_build.filesystem = spiffs

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.0
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    paulstoffregen/Time @ ^1.6.1
