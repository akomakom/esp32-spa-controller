<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1622">
  <title>Spa Control</title>
  <style>
    :root {
      --bg: #0b1622;
      --panel: #16232f;
      --panel-2: #1e2f3d;
      --line: #2b3f50;
      --text: #e8f1f8;
      --muted: #8fa6b6;
      --accent: #33bdef;
      --on: #ff4d4d;
      --low: #ffb020;
      --high: #ff7043;
      --dep: #ffd54a;
      --ok: #3ddc84;
      --shadow: 0 2px 8px rgba(0,0,0,.35);
      --radius: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 12px; padding-bottom: 40px;
    }

    /* ---- top status bar ---- */
    #topbar {
      display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 10px;
      align-items: stretch; margin-bottom: 16px;
    }
    .metric {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 10px 14px; text-align: center;
      box-shadow: var(--shadow);
    }
    .metric .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
    .metric .value { font-size: clamp(22px, 6vw, 38px); font-weight: 700; line-height: 1.1; margin-top: 4px; }
    .metric .sub { color: var(--muted); font-size: 12px; }
    #settingsBtn {
      background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: var(--radius); font-size: 24px; padding: 0 18px; cursor: pointer;
      box-shadow: var(--shadow);
    }
    #settingsBtn:active { background: var(--panel-2); }

    /* ---- controls grid ---- */
    #controls {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 12px; position: relative;
    }
    .card.is-on { border-color: var(--on); }
    .card-head { display: flex; align-items: center; justify-content: space-between; }
    .card-name { font-size: 20px; font-weight: 700; text-transform: capitalize; }
    .card-icons { display: flex; align-items: center; gap: 8px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #3a4d5e; display: inline-block; }
    .dot.on { background: var(--on); box-shadow: 0 0 10px var(--on); }
    .dot.dep { background: var(--dep); box-shadow: 0 0 10px var(--dep); }
    .iconbtn {
      background: none; border: none; color: var(--muted); font-size: 20px;
      cursor: pointer; padding: 4px; line-height: 1;
    }
    .iconbtn:active { color: var(--text); }
    .badge {
      font-size: 12px; color: var(--low); border: 1px solid var(--low);
      border-radius: 20px; padding: 2px 8px; cursor: pointer; white-space: nowrap;
    }
    .dep-flag { color: var(--dep); font-size: 15px; }

    /* main action row */
    .action { display: flex; align-items: center; gap: 10px; }
    .state-btn {
      flex: 1; border: none; border-radius: 12px; cursor: pointer;
      background: var(--panel-2); color: var(--text);
      font-size: 30px; font-weight: 800; padding: 18px 10px; letter-spacing: .04em;
      transition: background .12s;
    }
    .state-btn.on { background: linear-gradient(180deg, #ff6b6b, #e23b3b); }
    .state-btn.low { background: linear-gradient(180deg, #ffc659, #f5a623); color: #222; }
    .state-btn.high { background: linear-gradient(180deg, #ff8a5c, #ff5722); }
    .state-btn:active { filter: brightness(1.08); }
    .step-btn {
      width: 64px; height: 64px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--panel-2); color: var(--text); font-size: 34px; cursor: pointer;
    }
    .step-btn:active { background: var(--accent); color: #04222f; }
    .setpoint {
      flex: 1; text-align: center; font-size: 40px; font-weight: 800;
    }
    .setpoint small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
    .card.error { outline: 2px solid #ff5252; }

    /* ---- dialogs ---- */
    dialog {
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: var(--radius); padding: 0; width: min(440px, 92vw); box-shadow: 0 12px 40px rgba(0,0,0,.6);
    }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    .dlg-head { font-size: 20px; font-weight: 700; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .dlg-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .dlg-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { color: var(--muted); font-size: 14px; }
    .field .hint { color: var(--accent); font-size: 12px; }
    input[type=text], input[type=password], input[type=number] {
      background: var(--bg); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 12px; font-size: 17px; width: 100%;
    }
    input.invalid { border-color: #ff5252; }
    .btn {
      border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
      border-radius: 10px; padding: 12px 18px; font-size: 16px; cursor: pointer;
    }
    .btn.primary { background: var(--accent); color: #04222f; border-color: var(--accent); font-weight: 700; }
    .btn:active { filter: brightness(1.1); }
    .seg { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { flex: 1; background: var(--panel-2); color: var(--text); border: none; padding: 12px; font-size: 16px; cursor: pointer; }
    .seg button.sel { background: var(--accent); color: #04222f; font-weight: 700; }
    #durationGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    #durationGrid button {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 14px 6px; font-size: 15px; cursor: pointer;
    }
    #durationGrid button:active { background: var(--accent); color: #04222f; }
    .note { color: var(--muted); font-size: 13px; }
    #toast {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      background: #04222f; border: 1px solid var(--accent); color: var(--text);
      padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0;
      transition: opacity .2s; pointer-events: none; max-width: 90vw;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="topbar">
    <div class="metric" id="m-water">
      <div class="label">Water</div>
      <div class="value">--</div>
    </div>
    <div class="metric" id="m-time">
      <div class="label">Time</div>
      <div class="value">--</div>
      <div class="sub"></div>
    </div>
    <div class="metric" id="m-uptime">
      <div class="label">Uptime</div>
      <div class="value">--</div>
      <div class="sub">since boot</div>
    </div>
    <button id="settingsBtn" title="Settings">&#9881;</button>
  </div>

  <div id="controls"></div>

  <!-- Duration picker -->
  <dialog id="durationDialog">
    <div class="dlg-head" id="durationTitle">Run for…</div>
    <div class="dlg-body">
      <div class="note">Keep this control in its current mode for how long before returning to the normal schedule?</div>
      <div id="durationGrid"></div>
    </div>
    <div class="dlg-foot">
      <button class="btn" data-close>Cancel</button>
    </div>
  </dialog>

  <!-- Schedule config -->
  <dialog id="scheduleDialog">
    <div class="dlg-head" id="scheduleTitle">Schedule</div>
    <div class="dlg-body">
      <div class="field">
        <label>Percentage of day this control is "ON"</label>
        <input type="number" id="percentageOfDayOnTime" min="0" max="100">
        <span class="hint" id="hintDaily"></span>
      </div>
      <div class="field">
        <label>Number of "ON" periods per day</label>
        <input type="number" id="numberOfTimesToRun" min="1">
        <span class="hint" id="hintPer"></span>
      </div>
      <div class="field">
        <label>Value when scheduled ON <span class="note" id="onRange"></span></label>
        <input type="number" id="normalValueOn">
      </div>
      <div class="field">
        <label>Value when scheduled OFF <span class="note" id="offRange"></span></label>
        <input type="number" id="normalValueOff">
      </div>
      <div class="field">
        <label>Default override duration (seconds)</label>
        <input type="number" id="overrideDefaultDurationSeconds" min="0">
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="scheduleSave">Save</button>
    </div>
  </dialog>

  <!-- Settings -->
  <dialog id="settingsDialog">
    <div class="dlg-head">Settings</div>
    <div class="dlg-body">
      <div class="field">
        <label>Temperature unit</label>
        <div class="seg" id="unitSeg">
          <button data-unit="1">Celsius</button>
          <button data-unit="0">Fahrenheit</button>
        </div>
      </div>
      <hr style="border-color:var(--line); width:100%">
      <div class="note">WiFi network this controller connects to (separate from the built-in setup AP).</div>
      <div class="field">
        <label>SSID</label>
        <input type="text" id="wifi_ssid" autocomplete="off">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="wifi_pass" autocomplete="off">
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn" data-close>Close</button>
      <button class="btn primary" id="wifiSave">Save WiFi &amp; Reboot</button>
    </div>
  </dialog>

  <div id="toast"></div>

<script>
"use strict";
(function () {
  var POLL_MS = 5000;
  var unit = 1;            // 0 = F, 1 = C (from controller)
  var statusByName = {};   // latest control status keyed by name
  var pendingSetpoint = {};// name -> debounced setpoint state

  var durationOptions = [0,5,10,15,20,30,45,60,120,240,480,720,1440]; // minutes

  // ---- helpers ----
  function isC() { return unit === 1; }
  function toDisplayTemp(c) { return isC() ? c : (c * 9 / 5 + 32); }
  function unitLabel() { return isC() ? "°C" : "°F"; }

  function humanize(sec) {
    sec = Math.round(sec);
    if (sec <= 0) return "0s";
    var d = Math.floor(sec / 86400); sec -= d * 86400;
    var h = Math.floor(sec / 3600);  sec -= h * 3600;
    var m = Math.floor(sec / 60);    sec -= m * 60;
    var parts = [];
    if (d) parts.push(d + "d");
    if (h) parts.push(h + "h");
    if (m) parts.push(m + "m");
    if (!d && !h && sec) parts.push(sec + "s");
    return parts.slice(0, 2).join(" ") || "0s";
  }

  function post(url, data) {
    var body = Object.keys(data).map(function (k) {
      return encodeURIComponent(k) + "=" + encodeURIComponent(data[k]);
    }).join("&");
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    }).then(function (r) { if (!r.ok) throw new Error(r.status); return r; });
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2500);
  }

  var VAL_NAMES = {
    "off-on": ["OFF", "ON"],
    "off-low-high": ["OFF", "LOW", "HIGH"]
  };
  function stateClass(type, val) {
    if (type === "off-low-high") return ["", "low", "high"][val] || "";
    return val > 0 ? "on" : "";
  }

  // ---- rendering ----
  function ensureCard(c) {
    var id = "card-" + c.name;
    var card = document.getElementById(id);
    if (card) return card;

    card = document.createElement("div");
    card.className = "card";
    card.id = id;
    card.innerHTML =
      '<div class="card-head">' +
        '<span class="card-name"></span>' +
        '<span class="card-icons">' +
          '<span class="badge" style="display:none"></span>' +
          '<span class="dep-flag" title="May turn on when another control needs it" style="display:none">&#10562;</span>' +
          '<span class="dot"></span>' +
          '<button class="iconbtn cfg" title="Configure schedule">&#9881;</button>' +
        '</span>' +
      '</div>' +
      '<div class="action"></div>';

    card.querySelector(".cfg").addEventListener("click", function () { openSchedule(c.name); });
    card.querySelector(".badge").addEventListener("click", function () { openDuration(c.name); });
    document.getElementById("controls").appendChild(card);
    buildAction(card, c);
    return card;
  }

  function buildAction(card, c) {
    var action = card.querySelector(".action");
    action.innerHTML = "";
    if (c.type === "sensor-based") {
      var minus = mk("button", "step-btn", "−");
      var sp = mk("div", "setpoint", "");
      var plus = mk("button", "step-btn", "+");
      minus.addEventListener("click", function () { stepSetpoint(c.name, -1); });
      plus.addEventListener("click", function () { stepSetpoint(c.name, 1); });
      action.append(minus, sp, plus);
    } else {
      var btn = mk("button", "state-btn", "");
      btn.addEventListener("click", function () { toggleControl(c.name); });
      action.append(btn);
    }
  }

  function mk(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function renderCard(c) {
    var card = ensureCard(c);
    card.querySelector(".card-name").textContent = c.name;

    var isOn = c.val_o > 0;
    var isDepOn = !isOn && c.val_d > 0;
    card.classList.toggle("is-on", isOn);

    var dot = card.querySelector(".dot");
    dot.className = "dot" + (isOn ? " on" : isDepOn ? " dep" : "");
    dot.title = isOn ? "ON" : isDepOn ? "ON (required by another control)" : "OFF";

    card.querySelector(".dep-flag").style.display = c.depctl ? "" : "none";

    var badge = card.querySelector(".badge");
    if (c.ORT > 0) {
      badge.textContent = "⏱ " + humanize(c.ORT);
      badge.style.display = "";
      badge.title = "Override active — tap to change duration";
    } else {
      badge.style.display = "none";
    }

    if (c.type === "sensor-based") {
      var live = pendingSetpoint[c.name];
      var shown = live != null ? live : c.value;   // native °C
      card.querySelector(".setpoint").innerHTML =
        Math.round(toDisplayTemp(shown)) + unitLabel() +
        "<small>setpoint</small>";
    } else {
      var names = VAL_NAMES[c.type] || ["OFF", "ON"];
      var btn = card.querySelector(".state-btn");
      btn.textContent = names[c.value] || String(c.value);
      btn.className = "state-btn " + stateClass(c.type, c.value);
    }
  }

  // ---- actions ----
  function toggleControl(name) {
    post("/toggle", { control: name })
      .then(refresh)
      .catch(function () { flashError(name); });
  }

  function stepSetpoint(name, delta) {
    var c = statusByName[name];
    if (!c) return;
    var cur = pendingSetpoint[name] != null ? pendingSetpoint[name] : c.value; // native °C
    var next = Math.max(c.min, Math.min(c.max, cur + delta));
    pendingSetpoint[name] = next;
    renderCard(c); // optimistic
    clearTimeout(pendingSetpoint["_t_" + name]);
    pendingSetpoint["_t_" + name] = setTimeout(function () {
      var duration = c.ORT > 0 ? c.ORT : (c.DO || 0);
      post("/override", { control: name, start: 0, duration: duration, value: pendingSetpoint[name] })
        .then(function () { delete pendingSetpoint[name]; refresh(); })
        .catch(function () { delete pendingSetpoint[name]; flashError(name); });
    }, 600);
  }

  function flashError(name) {
    var card = document.getElementById("card-" + name);
    if (!card) return;
    card.classList.add("error");
    setTimeout(function () { card.classList.remove("error"); }, 1200);
    toast("Request failed for " + name);
  }

  // ---- duration dialog ----
  var durationTarget = null;
  function openDuration(name) {
    durationTarget = name;
    document.getElementById("durationTitle").textContent = "Run “" + name + "” for…";
    var grid = document.getElementById("durationGrid");
    grid.innerHTML = "";
    durationOptions.forEach(function (min) {
      var b = mk("button", null, min === 0 ? "End now" : humanize(min * 60));
      b.addEventListener("click", function () { applyDuration(min); });
      grid.appendChild(b);
    });
    document.getElementById("durationDialog").showModal();
  }
  function applyDuration(min) {
    var c = statusByName[durationTarget];
    if (!c) return;
    post("/override", { control: durationTarget, start: 0, duration: min * 60, value: c.value })
      .then(function () { document.getElementById("durationDialog").close(); refresh(); })
      .catch(function () { flashError(durationTarget); });
  }

  // ---- schedule dialog ----
  var scheduleTarget = null;
  function openSchedule(name) {
    scheduleTarget = name;
    var c = statusByName[name] || {};
    document.getElementById("scheduleTitle").textContent = "Schedule: " + name;
    document.getElementById("onRange").textContent = "(" + c.min + "–" + c.max + ")";
    document.getElementById("offRange").textContent = "(" + c.min + "–" + c.max + ")";
    fetch("/configureControl?control=" + encodeURIComponent(name))
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        ["percentageOfDayOnTime","numberOfTimesToRun","normalValueOn","normalValueOff","overrideDefaultDurationSeconds"]
          .forEach(function (k) { document.getElementById(k).value = cfg[k]; });
        updateScheduleHints();
        document.getElementById("scheduleDialog").showModal();
      })
      .catch(function () { toast("Could not load schedule"); });
  }
  function updateScheduleHints() {
    var pct = parseFloat(document.getElementById("percentageOfDayOnTime").value) || 0;
    var n = parseFloat(document.getElementById("numberOfTimesToRun").value) || 1;
    var dailySec = pct * 24 * 3600 / 100;
    document.getElementById("hintDaily").textContent = "≈ " + humanize(dailySec) + " per day";
    document.getElementById("hintPer").textContent = "≈ " + humanize(dailySec / n) + " on, per period";
  }
  document.getElementById("percentageOfDayOnTime").addEventListener("input", updateScheduleHints);
  document.getElementById("numberOfTimesToRun").addEventListener("input", updateScheduleHints);
  document.getElementById("scheduleSave").addEventListener("click", function () {
    var c = statusByName[scheduleTarget] || {};
    var data = { control: scheduleTarget };
    var ok = true;
    ["percentageOfDayOnTime","numberOfTimesToRun","normalValueOn","normalValueOff","overrideDefaultDurationSeconds"]
      .forEach(function (k) {
        var el = document.getElementById(k);
        data[k] = el.value;
        if ((k === "normalValueOn" || k === "normalValueOff") &&
            (Number(el.value) < c.min || Number(el.value) > c.max)) {
          el.classList.add("invalid"); ok = false;
        } else { el.classList.remove("invalid"); }
      });
    if (!ok) { toast("Value out of range (" + c.min + "–" + c.max + ")"); return; }
    post("/configureControl", data)
      .then(function () { document.getElementById("scheduleDialog").close(); refresh(); })
      .catch(function (e) { toast("Save failed"); });
  });

  // ---- settings dialog ----
  document.getElementById("settingsBtn").addEventListener("click", function () {
    markUnit();
    document.getElementById("settingsDialog").showModal();
  });
  function markUnit() {
    document.querySelectorAll("#unitSeg button").forEach(function (b) {
      b.classList.toggle("sel", Number(b.dataset.unit) === unit);
    });
  }
  document.querySelectorAll("#unitSeg button").forEach(function (b) {
    b.addEventListener("click", function () {
      var u = Number(b.dataset.unit);
      post("/tempUnit", { unit: u })
        .then(function () { unit = u; markUnit(); refresh(); toast("Unit updated"); })
        .catch(function () { toast("Could not set unit"); });
    });
  });
  document.getElementById("wifiSave").addEventListener("click", function () {
    post("/configureWifi", {
      wifi_ssid: document.getElementById("wifi_ssid").value,
      wifi_pass: document.getElementById("wifi_pass").value
    }).then(function () { toast("Saved — rebooting"); })
      .catch(function () { toast("Save failed (auth required)"); });
  });

  // close buttons for all dialogs
  document.querySelectorAll("dialog [data-close]").forEach(function (b) {
    b.addEventListener("click", function () { b.closest("dialog").close(); });
  });

  // ---- status polling ----
  function refresh() { return updateStatus(); }
  function updateStatus() {
    return fetch("status").then(function (r) { return r.json(); }).then(function (data) {
      var m = data.metrics || {};
      if (typeof m.temp_unit !== "undefined") unit = Number(m.temp_unit);

      var waterEl = document.querySelector("#m-water .value");
      waterEl.textContent = (m.temp == null) ? "--" : (toDisplayTemp(m.temp).toFixed(1) + unitLabel());

      if (m.time) {
        var t = new Date(m.time * 1000);
        document.querySelector("#m-time .value").textContent =
          t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        document.querySelector("#m-time .sub").textContent = t.toLocaleDateString();
      }
      if (m.uptime != null) {
        document.querySelector("#m-uptime .value").textContent = humanize(m.uptime);
      }

      (data.controls || []).forEach(function (c) {
        statusByName[c.name] = c;
        renderCard(c);
      });
    }).catch(function () { /* transient network error, keep last state */ });
  }

  updateStatus();
  setInterval(updateStatus, POLL_MS);
})();
</script>
</body>
</html>
